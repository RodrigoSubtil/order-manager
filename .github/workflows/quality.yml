name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: order_manager_dev
          POSTGRES_USER: order_manager
          POSTGRES_PASSWORD: order_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U order_manager -d order_manager_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://order_manager:order_manager@localhost:5432/order_manager_dev?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run format:check
      - run: npm run lint
      - run: npm run security:check
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test:coverage
      - run: npm run test:coverage:api
      - run: npm run test:e2e
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run build
