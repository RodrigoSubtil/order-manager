name: Build and deploy staging

on:
  workflow_dispatch:
    inputs:
      confirm_deployment:
        description: 'Type deploy to confirm the approved staging release.'
        required: true
        type: string

concurrency:
  group: order-manager-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/${{ github.repository }}-api:${{ github.sha }}
  API_MIGRATE_IMAGE: ghcr.io/${{ github.repository }}-api-migrate:${{ github.sha }}
  WEB_IMAGE: ghcr.io/${{ github.repository }}-web:${{ github.sha }}

jobs:
  verify:
    if: inputs.confirm_deployment == 'deploy'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: order_manager_dev
          POSTGRES_USER: order_manager
          POSTGRES_PASSWORD: order_manager
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U order_manager -d order_manager_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://order_manager:order_manager@localhost:5432/order_manager_dev?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run security:check
      - run: npm run typecheck
      - run: npm run api:check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run db:reset
      - run: npm run test:db
      - run: npm run build

  build_images:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.API_IMAGE }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: migrate
          push: true
          tags: ${{ env.API_MIGRATE_IMAGE }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: VITE_API_BASE_URL=${{ vars.STAGING_API_BASE_URL }}
          push: true
          tags: ${{ env.WEB_IMAGE }}

  migrate_staging:
    needs: build_images
    runs-on: [self-hosted, staging]
    environment: staging
    permissions:
      contents: read
      packages: read
    if: inputs.confirm_deployment == 'deploy'
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      BACKUP_REFERENCE: ${{ vars.STAGING_BACKUP_REFERENCE }}
      BACKUP_VERIFIED_AT: ${{ vars.STAGING_BACKUP_VERIFIED_AT }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker compose -f deploy/compose.staging.yml pull migrate
      - run: docker compose -f deploy/compose.staging.yml --profile migration run --rm migrate

  deploy_staging:
    needs: migrate_staging
    runs-on: [self-hosted, staging]
    environment: staging
    permissions:
      contents: read
      packages: read
    if: inputs.confirm_deployment == 'deploy'
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      API_CORS_ORIGINS: ${{ vars.STAGING_WEB_ORIGIN }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_INVITE_REDIRECT_URL: ${{ vars.STAGING_SUPABASE_INVITE_REDIRECT_URL }}
      SUPABASE_PASSWORD_RECOVERY_REDIRECT_URL: ${{ vars.STAGING_SUPABASE_PASSWORD_RECOVERY_REDIRECT_URL }}
      SESSION_CONTEXT_SECRET: ${{ secrets.STAGING_SESSION_CONTEXT_SECRET }}
      METRICS_ENABLED: ${{ vars.STAGING_METRICS_ENABLED }}
      METRICS_AUTH_TOKEN: ${{ secrets.STAGING_METRICS_AUTH_TOKEN }}
      SENTRY_ENABLED: ${{ vars.STAGING_SENTRY_ENABLED }}
      SENTRY_DSN: ${{ secrets.STAGING_SENTRY_DSN }}
      SENTRY_TRACES_SAMPLE_RATE: ${{ vars.STAGING_SENTRY_TRACES_SAMPLE_RATE }}
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: docker compose -f deploy/compose.staging.yml pull api web
      - run: docker compose -f deploy/compose.staging.yml up -d --remove-orphans api web
      - run: >-
          docker compose -f deploy/compose.staging.yml exec -T api node -e
          "fetch('http://127.0.0.1:3000/api/v1/health/ready').then((response) => process.exit(response.ok ? 0 : 1))"
