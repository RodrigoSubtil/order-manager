name: Contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  generated-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run api:generate
      - run: npm run typecheck
      - run: git diff --exit-code -- apps/api/openapi.json packages/api-client/src/generated
