<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="728" viewBox="0 0 1040 728" role="img" aria-labelledby="title desc"><title id="title">Paleta do Order Manager</title><desc id="desc">Base castanha e creme, estados em vermelho, amarelo e verde. Confirmar e remover com preenchimento forte, WhatsApp verde suave e editar amarelo suave. Raio global de 0,6rem.</desc><rect width="1040" height="728" fill="#FBFAF7"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="24" y="42" fill="#4D4339" font-size="26" font-weight="600">Order Manager · Cores e estados</text><text x="24" y="70" fill="#6B5C4D" font-size="15">Uma base quente. Três famílias de estado. Uma função para cada cor.</text><rect x="24" y="96" width="192" height="52" rx="9.6" fill="#765F4B" stroke="#D8C8B7"/><text x="24" y="171" font-size="14" font-weight="600" fill="#4D4339">Marca</text><text x="24" y="191" font-size="13" fill="#6B5C4D">#765F4B</text><rect x="224" y="96" width="192" height="52" rx="9.6" fill="#F4EDE3" stroke="#D8C8B7"/><text x="224" y="171" font-size="14" font-weight="600" fill="#4D4339">Creme</text><text x="224" y="191" font-size="13" fill="#6B5C4D">#F4EDE3</text><rect x="424" y="96" width="192" height="52" rx="9.6" fill="#4D4339" stroke="#D8C8B7"/><text x="424" y="171" font-size="14" font-weight="600" fill="#4D4339">Texto principal</text><text x="424" y="191" font-size="13" fill="#6B5C4D">#4D4339</text><rect x="624" y="96" width="192" height="52" rx="9.6" fill="#6B5C4D" stroke="#D8C8B7"/><text x="624" y="171" font-size="14" font-weight="600" fill="#4D4339">Texto secundário</text><text x="624" y="191" font-size="13" fill="#6B5C4D">#6B5C4D</text><rect x="824" y="96" width="192" height="52" rx="9.6" fill="#FFFFFF" stroke="#D8C8B7"/><text x="824" y="171" font-size="14" font-weight="600" fill="#4D4339">Superfície</text><text x="824" y="191" font-size="13" fill="#6B5C4D">#FFFFFF</text><rect x="24" y="204" width="192" height="52" rx="9.6" fill="#F1EEE8" stroke="#D8C8B7"/><text x="24" y="279" font-size="14" font-weight="600" fill="#4D4339">Fundo</text><text x="24" y="299" font-size="13" fill="#6B5C4D">#F1EEE8</text><rect x="224" y="204" width="192" height="52" rx="9.6" fill="#FBFAF7" stroke="#D8C8B7"/><text x="224" y="279" font-size="14" font-weight="600" fill="#4D4339">Superfície suave</text><text x="224" y="299" font-size="13" fill="#6B5C4D">#FBFAF7</text><rect x="424" y="204" width="192" height="52" rx="9.6" fill="#A68C76" stroke="#D8C8B7"/><text x="424" y="279" font-size="14" font-weight="600" fill="#4D4339">Borda de campo</text><text x="424" y="299" font-size="13" fill="#6B5C4D">#A68C76</text><rect x="624" y="204" width="192" height="52" rx="9.6" fill="#D8C8B7" stroke="#D8C8B7"/><text x="624" y="279" font-size="14" font-weight="600" fill="#4D4339">Linha estrutural</text><text x="624" y="299" font-size="13" fill="#6B5C4D">#D8C8B7</text><rect x="824" y="204" width="192" height="52" rx="9.6" fill="#7B6D60" stroke="#D8C8B7"/><text x="824" y="279" font-size="14" font-weight="600" fill="#4D4339">Placeholder</text><text x="824" y="299" font-size="13" fill="#6B5C4D">#7B6D60</text><text x="24" y="338" fill="#4D4339" font-size="18" font-weight="600">Estados com texto, fundo e borda da mesma família</text><rect x="24" y="356" width="320" height="150" rx="9.6" fill="#FCECE9" stroke="#E5AAA3"/><text x="40" y="390" font-size="17" font-weight="600" fill="#A83F3A">!  Conferir / Recolha atrasada</text><text x="40" y="422" font-size="14" fill="#A83F3A">Texto #A83F3A</text><text x="40" y="448" font-size="14" fill="#A83F3A">Fundo #FCECE9</text><text x="40" y="474" font-size="14" fill="#A83F3A">Borda #E5AAA3</text><rect x="360" y="356" width="320" height="150" rx="9.6" fill="#FFF1DC" stroke="#E2BB7E"/><text x="376" y="390" font-size="17" font-weight="600" fill="#99550F">!  Provável</text><text x="376" y="422" font-size="14" fill="#99550F">Texto #99550F</text><text x="376" y="448" font-size="14" fill="#99550F">Fundo #FFF1DC</text><text x="376" y="474" font-size="14" fill="#99550F">Borda #E2BB7E</text><rect x="696" y="356" width="320" height="150" rx="9.6" fill="#E8F4EC" stroke="#A5CDB4"/><text x="712" y="390" font-size="17" font-weight="600" fill="#2F6D50">✓  Conferido</text><text x="712" y="422" font-size="14" fill="#2F6D50">Texto #2F6D50</text><text x="712" y="448" font-size="14" fill="#2F6D50">Fundo #E8F4EC</text><text x="712" y="474" font-size="14" fill="#2F6D50">Borda #A5CDB4</text><text x="24" y="546" fill="#4D4339" font-size="18" font-weight="600">Ações com hierarquia consistente · raio único de 0,6rem</text><rect x="24" y="566" width="240" height="48" rx="9.6" fill="#2F6D50" stroke="#2F6D50"/><text x="144" y="596" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Salvar / Concluir</text><rect x="276" y="566" width="240" height="48" rx="9.6" fill="#E8F4EC" stroke="#A5CDB4"/><text x="396" y="596" text-anchor="middle" font-size="16" font-weight="600" fill="#2F6D50">WhatsApp</text><rect x="528" y="566" width="240" height="48" rx="9.6" fill="#FFF1DC" stroke="#E2BB7E"/><text x="648" y="596" text-anchor="middle" font-size="16" font-weight="600" fill="#99550F">Editar</text><rect x="780" y="566" width="240" height="48" rx="9.6" fill="#A83F3A" stroke="#A83F3A"/><text x="900" y="596" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF">Apagar / Descartar</text><rect x="24" y="630" width="240" height="48" rx="9.6" fill="#E8F4EC" stroke="#A5CDB4"/><text x="144" y="660" text-anchor="middle" font-size="16" font-weight="600" fill="#2F6D50">+ Adicionar produto</text><rect x="276" y="630" width="240" height="48" rx="9.6" fill="#F4EDE3" stroke="#A58E74"/><text x="396" y="660" text-anchor="middle" font-size="16" font-weight="600" fill="#765F4B">Imprimir / Voltar</text><rect x="528" y="630" width="240" height="48" rx="9.6" fill="#FCECE9" stroke="#E5AAA3"/><text x="648" y="660" text-anchor="middle" font-size="16" font-weight="600" fill="#A83F3A">Cancelar</text><rect x="780" y="630" width="240" height="48" rx="9.6" fill="#FCECE9" stroke="#E5AAA3"/><text x="900" y="660" text-anchor="middle" font-size="16" font-weight="600" fill="#A83F3A">Remover produto</text></g></svg>