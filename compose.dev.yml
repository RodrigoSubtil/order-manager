name: order-manager-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_manager_dev
      POSTGRES_USER: order_manager
      POSTGRES_PASSWORD: order_manager
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U order_manager -d order_manager_dev']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://order_manager:order_manager@postgres:5432/order_manager_dev?schema=public
    env_file:
      - path: apps/api/.env
        required: false
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  web:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:3000
    ports:
      - '127.0.0.1:5173:8080'
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-dev-data:
