name: order-manager-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: order_manager_test
      POSTGRES_USER: order_manager
      POSTGRES_PASSWORD: order_manager
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U order_manager -d order_manager_test']
      interval: 5s
      timeout: 3s
      retries: 10

  api-unit-tests:
    profiles: ['tests']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    working_dir: /app
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://order_manager:order_manager@postgres:5432/order_manager_test?schema=public
      API_CORS_ORIGINS: http://localhost:5173
      API_SWAGGER_ENABLED: 'false'
      SUPABASE_URL: https://project.supabase.co
      SUPABASE_ANON_KEY: test-only-anon-key
      SESSION_CONTEXT_SECRET: test-only-context-secret-at-least-32-characters
    command: npm run test --workspace @order-manager/api
    depends_on:
      postgres:
        condition: service_healthy
